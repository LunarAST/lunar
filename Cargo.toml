[package]
name = "lunar"
version = "0.1.0"
edition = "2021"
description = "LunarAST CLI - Static interface contract extraction and comparison"

[dependencies]
lunar-interface = { path = "../lunar-interface" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
chrono = "0.4"
wait-timeout = "0.2"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
dirs = "5"
rust-s3 = "0.37"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "process", "signal"] }
totp-lite = "2.0"
data-encoding = "2.6"
qrcode = "0.14"
