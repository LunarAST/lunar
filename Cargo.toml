[package]
name = "lunar"
version = "0.1.0"
edition = "2021"
description = "LunarAST CLI - Static interface contract extraction and comparison"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
chrono = "0.4"

[lib]
name = "lunar"
path = "src/lib.rs"
